[project]
name = "hivemind-orchestrator"
version = "0.1.0"
description = "HiveMind AI Orchestrator Runtime"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.0",
    "argon2-cffi>=23.1.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "boto3>=1.34.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "email-validator>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[project.scripts]
orchestrator = "orchestrator.cli:main"
shop-backend = "shop_backend.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["shop_backend*", "orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
