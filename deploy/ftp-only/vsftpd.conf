# Tinfoil FTP shop - vsftpd on port 2121, read-only, all users chrooted to the
# shared unified root (/srv/tinfoil-unified, set as their home by ftp_user_service).
listen=YES
listen_ipv6=NO
listen_port=2121

anonymous_enable=NO
local_enable=YES
write_enable=NO
local_umask=022
dirmessage_enable=YES
use_localtime=YES
xferlog_enable=YES
connect_from_port_20=NO

# Chroot every local user to their home (= /srv/tinfoil-unified).
chroot_local_user=YES
allow_writeable_chroot=YES

secure_chroot_dir=/var/run/vsftpd/empty
pam_service_name=vsftpd
hide_ids=YES
seccomp_sandbox=NO

# Passive mode (must match the ufw range 30000-30100 and pasv_address = server IP).
pasv_enable=YES
pasv_min_port=30000
pasv_max_port=30100
pasv_address=103.149.86.18
